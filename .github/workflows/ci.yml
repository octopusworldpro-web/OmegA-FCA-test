name: OmegA-FCA CI

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: omega-fca-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and static checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security and dependency audit
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package dry run
        run: npm pack --dry-run
