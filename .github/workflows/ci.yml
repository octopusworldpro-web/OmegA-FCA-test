name: OmegA-FCA CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: omega-fca-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: generate package lockfile"
            git push
          fi

      - name: Security and dependency audit
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package dry run
        run: npm pack --dry-run
